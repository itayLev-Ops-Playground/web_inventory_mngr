<VirtualHost *:80>
        ServerName localhost

        WSGIDaemonProcess inv-web-mngr python-home=/var/www/inv-web-mngr/venv python-path=/var/www/inv-web-mngr
        WSGIProcessGroup inv-web-mngr
        WSGIScriptAlias / /var/www/inv-web-mngr/app.wsgi

    <Directory /var/www/inv-web-mngr>
        Require all granted
        WSGIProcessGroup inv-web-mngr
        WSGIApplicationGroup %{GLOBAL}
    </Directory>


    ErrorLog /var/log/apache2/inv-web-mngr-error.log
    CustomLog /var/log/apache2/inv-web-mngr-access.log combined
</VirtualHost>
